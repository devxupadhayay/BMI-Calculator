<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart BMI Dashboard</title>
    <style>
        /* Modern CSS Reset and Base Styles */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #121212; /* Sleek dark background */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .dashboard-card {
            background: #1e1e24;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #a0a0a0;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #2a2a35;
            border: 2px solid #2a2a35;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #00d2ff;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4);
        }

        /* --- Unique Result Area Styles --- */
        .result-area {
            margin-top: 30px;
            text-align: center;
            display: none; /* Hidden until calculated */
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bmi-value {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 10px 0;
        }

        .bmi-category {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Visual Gauge */
        .gauge-track {
            width: 100%;
            height: 12px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .gauge-fill {
            height: 100%;
            width: 0%; /* Will be changed by JS */
            background: #2ecc71; 
            border-radius: 10px;
            transition: width 1s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 1s;
        }

        .tips {
            font-size: 14px;
            color: #a0a0a0;
            background: #2a2a35;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <h2>⚡ Smart BMI Tracker</h2>
        
        <div class="input-group">
            <label>Weight (in Kilograms)</label>
            <input type="number" id="weight" placeholder="e.g. 70" step="0.1">
        </div>

        <div class="input-group">
            <label>Height (in Centimeters)</label>
            <input type="number" id="height" placeholder="e.g. 175">
        </div>

        <button onclick="calculateBMI()">Calculate Health Status</button>

        <!-- Unique Visual Result Section -->
        <div class="result-area" id="resultBox">
            <div class="gauge-track">
                <div class="gauge-fill" id="gaugeBar"></div>
            </div>
            
            <div class="bmi-value" id="bmiNumber">0.0</div>
            <div class="bmi-category" id="bmiStatus">Status</div>
            
            <div class="tips" id="healthTip">
                <!-- Advice generated by JS -->
            </div>
        </div>
    </div>

    <script>
        function calculateBMI() {
            // 1. Get user inputs
            let weight = parseFloat(document.getElementById('weight').value);
            let heightCm = parseFloat(document.getElementById('height').value);

            // Validation: Make sure inputs are correct numbers
            if (isNaN(weight) || isNaN(heightCm) || weight <= 0 || heightCm <= 0) {
                alert("Please enter valid positive numbers for weight and height.");
                return;
            }

            // 2. BMI Math Logic
            // Formula: Weight(kg) / (Height(m) * Height(m))
            let heightMeters = heightCm / 100;
            let bmi = weight / (heightMeters * heightMeters);
            bmi = bmi.toFixed(1); // Round to 1 decimal place

            // 3. Determine Category, Colors, and Tips
            let category = "";
            let color = "";
            let tip = "";
            let gaugePercentage = 0;

            if (bmi < 18.5) {
                category = "Underweight 🧊";
                color = "#3498db"; // Blue
                tip = "Try incorporating more nutrient-dense foods and healthy fats into your diet to build mass safely.";
                gaugePercentage = 25; // Fill bar 25%
            } 
            else if (bmi >= 18.5 && bmi <= 24.9) {
                category = "Normal Weight ✅";
                color = "#2ecc71"; // Green
                tip = "Great job! Keep maintaining your current balanced diet and active lifestyle.";
                gaugePercentage = 50; // Fill bar 50%
            } 
            else if (bmi >= 25 && bmi <= 29.9) {
                category = "Overweight ⚠️";
                color = "#f39c12"; // Orange
                tip = "Consider adding 30 minutes of daily cardio and monitoring your caloric intake.";
                gaugePercentage = 75; // Fill bar 75%
            } 
            else {
                category = "Obese 🚨";
                color = "#e74c3c"; // Red
                tip = "It is highly recommended to consult a healthcare provider for a personalized health plan.";
                gaugePercentage = 100; // Fill bar 100%
            }

            // 4. Update the HTML/UI
            document.getElementById('bmiNumber').innerText = bmi;
            
            let statusElement = document.getElementById('bmiStatus');
            statusElement.innerText = category;
            statusElement.style.color = color;
            
            document.getElementById('healthTip').innerText = tip;

            // Animate the gauge bar
            let gaugeBar = document.getElementById('gaugeBar');
            gaugeBar.style.width = gaugePercentage + "%";
            gaugeBar.style.backgroundColor = color;

            // Show the result area smoothly
            document.getElementById('resultBox').style.display = "block";
        }
    </script>
</body>
</html>
