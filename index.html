<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Smart BMI & Diet Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables for Theming */
        :root {
            /* Dark Theme (Default) */
            --bg-1: #0f2027; --bg-2: #203a43; --bg-3: #2c5364; --bg-4: #121212;
            --card-bg: rgba(30, 30, 36, 0.75);
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --input-bg: rgba(0, 0, 0, 0.2);
            --input-border: rgba(255, 255, 255, 0.1);
            --box-shadow: rgba(0, 0, 0, 0.5);
            --stat-bg: rgba(255, 255, 255, 0.05);
            --diet-bg: rgba(0, 0, 0, 0.2);
        }

        [data-theme="light"] {
            /* Light Theme */
            --bg-1: #fdfbfb; --bg-2: #ebedee; --bg-3: #e2ebf0; --bg-4: #cfd9df;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1a1a1a;
            --text-muted: #555555;
            --input-bg: rgba(0, 0, 0, 0.05);
            --input-border: rgba(0, 0, 0, 0.1);
            --box-shadow: rgba(0, 0, 0, 0.1);
            --stat-bg: rgba(0, 0, 0, 0.03);
            --diet-bg: rgba(255, 255, 255, 0.6);
        }

        /* Base Styles */
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        
        body {
            background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3), var(--bg-4));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .dashboard-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--input-border);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 25px 45px var(--box-shadow);
            width: 100%;
            max-width: 550px;
            position: relative;
        }

        /* Theme Toggle Button */
        .theme-toggle {
            position: absolute;
            top: 25px;
            right: 25px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .theme-toggle:hover {
            background: rgba(0, 210, 255, 0.2);
            border-color: #00d2ff;
        }

        h2 {
            text-align: left;
            margin-bottom: 25px;
            color: var(--text-main);
            font-weight: 700;
            font-size: 1.8rem;
        }

        .toggle-container {
            display: flex;
            background: var(--input-bg);
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid var(--input-border);
        }

        .toggle-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-muted);
        }

        .toggle-btn.active {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            color: white;
        }

        .row-group { display: flex; gap: 15px; margin-bottom: 20px; }
        .input-group { flex: 1; margin-bottom: 20px; position: relative; }
        .row-group .input-group { margin-bottom: 0; }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 15px;
            appearance: none;
        }

        select option {
            background: var(--card-bg);
            color: var(--text-main);
        }

        input:focus, select:focus {
            outline: none;
            border-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .conversion-hint {
            font-size: 12px;
            color: #00d2ff;
            margin-top: 6px;
            font-weight: 500;
        }

        button.calc-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 0 8px 20px rgba(58, 123, 213, 0.4);
        }

        button.calc-btn:hover { transform: translateY(-3px); }

        .error-shake {
            animation: shake 0.4s ease-in-out;
            background: linear-gradient(45deg, #ff416c, #ff4b2b) !important;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Result Area */
        .result-area {
            margin-top: 30px;
            display: none;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .bmi-value {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 5px 0;
            line-height: 1;
        }

        .bmi-category {
            font-size: 1.2rem;
            font-weight: 600;
        }

        /* Stats Grid */
        .detailed-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: var(--stat-bg);
            padding: 15px;
            border-radius: 12px;
            border-left: 3px solid #00d2ff;
        }

        .stat-box.full { grid-column: span 2; }
        .stat-box p { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .stat-box strong { font-size: 16px; color: var(--text-main); }
        
        .macro-row {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 13px;
            color: var(--text-main);
            font-weight: 600;
        }
        .macro-row span { padding: 4px 8px; border-radius: 6px; background: rgba(0,0,0,0.2); }

        /* Diet Section */
        .diet-section {
            background: var(--diet-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--input-border);
        }

        .diet-section h3 {
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
        }

        .meal-item {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px dashed var(--input-border);
        }
        .meal-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        .meal-time { font-size: 12px; color: #00d2ff; font-weight: 700; text-transform: uppercase; }
        .meal-desc { font-size: 14px; color: var(--text-main); margin-top: 4px; }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️ Light Mode</button>
        <h2>⚡ Health Planner Pro</h2>
        
        <!-- Unit Toggle -->
        <div class="toggle-container">
            <div class="toggle-btn active" id="btnMetric" onclick="setUnit('metric')">Metric</div>
            <div class="toggle-btn" id="btnImperial" onclick="setUnit('imperial')">Imperial</div>
        </div>

        <!-- Demographics & Activity -->
        <div class="row-group">
            <div class="input-group">
                <label>Age (Years)</label>
                <input type="number" id="age" placeholder="e.g. 30" min="15" max="100">
            </div>
            <div class="input-group">
                <label>Gender</label>
                <select id="gender">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label>Daily Activity Level</label>
            <select id="activity">
                <option value="1.2">Sedentary (Little/No exercise)</option>
                <option value="1.375">Lightly Active (Exercise 1-3 days/week)</option>
                <option value="1.55">Moderately Active (Exercise 3-5 days/week)</option>
                <option value="1.725">Very Active (Exercise 6-7 days/week)</option>
                <option value="1.9">Extra Active (Very hard exercise/physical job)</option>
            </select>
        </div>

        <!-- Height Input -->
        <div id="heightMetricWrapper" class="input-group">
            <label>Height (Centimeters)</label>
            <input type="number" id="heightCm" placeholder="e.g. 175" step="0.1" oninput="updateLiveConversions()">
            <div class="conversion-hint" id="hintHeightCm">≈ 5' 8.9"</div>
        </div>

        <div id="heightImperialWrapper" class="row-group" style="display:none;">
            <div class="input-group">
                <label>Feet</label>
                <input type="number" id="heightFt" placeholder="5" oninput="updateLiveConversions()">
            </div>
            <div class="input-group">
                <label>Inches</label>
                <input type="number" id="heightIn" placeholder="8" oninput="updateLiveConversions()">
            </div>
        </div>
        <div class="conversion-hint" id="hintHeightImp" style="display:none; margin-top:-15px; margin-bottom:20px;">≈ 172.7 cm</div>

        <!-- Weight Input -->
        <div class="input-group">
            <label id="lblWeight">Weight (Kilograms)</label>
            <input type="number" id="weight" placeholder="e.g. 70" step="0.1" oninput="updateLiveConversions()">
            <div class="conversion-hint" id="hintWeight">≈ 154.3 lbs</div>
        </div>

        <button class="calc-btn" id="calcBtn" onclick="calculatePlan()">Generate Complete Plan</button>

        <!-- Result Section -->
        <div class="result-area" id="resultBox">
            
            <div class="result-header">
                <div class="bmi-category" id="bmiStatus">Status</div>
                <div class="bmi-value" id="bmiNumber">0.0</div>
            </div>
            
            <div class="detailed-stats">
                <div class="stat-box">
                    <p>Base Metabolism (BMR)</p>
                    <strong id="bmrText">-- kcal</strong>
                </div>
                <div class="stat-box">
                    <p>Daily Energy Exp. (TDEE)</p>
                    <strong id="tdeeText">-- kcal</strong>
                </div>
                
                <div class="stat-box full">
                    <p>Your Daily Calorie Target (<span id="goalText">--</span>)</p>
                    <strong id="targetCalText" style="font-size: 22px; color: #00d2ff;">-- kcal</strong>
                    <div class="macro-row">
                        <span id="protText">🍖 --g</span>
                        <span id="carbText">🍚 --g</span>
                        <span id="fatText">🥑 --g</span>
                    </div>
                </div>
            </div>

            <!-- Dynamic Diet Section -->
            <div class="diet-section">
                <h3>🍽️ Sample Meal Plan</h3>
                <div id="dietPlanContent">
                    <!-- Populated by JS -->
                </div>
            </div>

        </div>
    </div>

    <script>
        let currentUnit = 'metric';

        // Theme Toggle Logic
        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('themeBtn');
            if (html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
                btn.innerText = "🌙 Dark Mode";
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.innerText = "☀️ Light Mode";
            }
        }

        // Unit Toggle Logic
        function setUnit(unit) {
            currentUnit = unit;
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('weight').value = '';
            document.getElementById('heightCm').value = '';
            document.getElementById('heightFt').value = '';
            document.getElementById('heightIn').value = '';
            document.getElementById('hintWeight').innerText = "Enter weight to convert";

            if (unit === 'metric') {
                document.getElementById('btnMetric').classList.add('active');
                document.getElementById('btnImperial').classList.remove('active');
                document.getElementById('heightMetricWrapper').style.display = 'block';
                document.getElementById('heightImperialWrapper').style.display = 'none';
                document.getElementById('hintHeightImp').style.display = 'none';
                document.getElementById('hintHeightCm').style.display = 'block';
                document.getElementById('lblWeight').innerText = "Weight (Kilograms)";
                document.getElementById('weight').placeholder = "e.g. 70";
            } else {
                document.getElementById('btnImperial').classList.add('active');
                document.getElementById('btnMetric').classList.remove('active');
                document.getElementById('heightMetricWrapper').style.display = 'none';
                document.getElementById('heightImperialWrapper').style.display = 'flex';
                document.getElementById('hintHeightImp').style.display = 'block';
                document.getElementById('hintHeightCm').style.display = 'none';
                document.getElementById('lblWeight').innerText = "Weight (Pounds)";
                document.getElementById('weight').placeholder = "e.g. 150";
            }
        }

        // Live Converter
        function updateLiveConversions() {
            let weightInput = parseFloat(document.getElementById('weight').value);
            if (!isNaN(weightInput) && weightInput > 0) {
                if (currentUnit === 'metric') {
                    document.getElementById('hintWeight').innerText = `≈ ${(weightInput * 2.20462).toFixed(1)} lbs`;
                } else {
                    document.getElementById('hintWeight').innerText = `≈ ${(weightInput / 2.20462).toFixed(1)} kg`;
                }
            } else { document.getElementById('hintWeight').innerText = ""; }

            if (currentUnit === 'metric') {
                let cmInput = parseFloat(document.getElementById('heightCm').value);
                if (!isNaN(cmInput) && cmInput > 0) {
                    let totalIn = cmInput / 2.54;
                    document.getElementById('hintHeightCm').innerText = `≈ ${Math.floor(totalIn / 12)}' ${(totalIn % 12).toFixed(1)}"`;
                } else { document.getElementById('hintHeightCm').innerText = ""; }
            } else {
                let ftInput = parseFloat(document.getElementById('heightFt').value) || 0;
                let inInput = parseFloat(document.getElementById('heightIn').value) || 0;
                if (ftInput > 0 || inInput > 0) {
                    document.getElementById('hintHeightImp').innerText = `≈ ${(((ftInput * 12) + inInput) * 2.54).toFixed(1)} cm`;
                } else { document.getElementById('hintHeightImp').innerText = ""; }
            }
        }

        // Main Calculation Function
        function calculatePlan() {
            let weight = parseFloat(document.getElementById('weight').value);
            let age = parseInt(document.getElementById('age').value);
            let gender = document.getElementById('gender').value;
            let activity = parseFloat(document.getElementById('activity').value);

            if (isNaN(weight) || isNaN(age) || weight <= 0 || age <= 0) {
                const btn = document.getElementById('calcBtn');
                btn.classList.add('error-shake');
                btn.innerText = "Please fill all fields!";
                setTimeout(() => { btn.classList.remove('error-shake'); btn.innerText = "Generate Complete Plan"; }, 1000);
                return;
            }

            let heightCm = currentUnit === 'metric' ? parseFloat(document.getElementById('heightCm').value) : 
                           (((parseFloat(document.getElementById('heightFt').value) || 0) * 12) + (parseFloat(document.getElementById('heightIn').value) || 0)) * 2.54;
            
            let weightKg = currentUnit === 'metric' ? weight : weight / 2.20462;
            let heightMeters = heightCm / 100;

            if (isNaN(heightCm) || heightCm <= 0) return;

            // BMI Calculation
            let bmi = (weightKg / (heightMeters * heightMeters)).toFixed(1);

            // BMR Calculation (Mifflin-St Jeor)
            let bmr = gender === 'male' ? (10 * weightKg) + (6.25 * heightCm) - (5 * age) + 5 
                                        : (10 * weightKg) + (6.25 * heightCm) - (5 * age) - 161;
            
            // TDEE Calculation
            let tdee = bmr * activity;

            // Determine Target Calories & Goal based on BMI
            let targetCals = tdee;
            let category = "";
            let color = "";
            let goalStr = "";
            let dietType = "";

            if (bmi < 18.5) {
                category = "Underweight"; color = "#3498db"; goalStr = "Weight Gain";
                targetCals = tdee + 500; // Surplus
                dietType = "bulk";
            } else if (bmi >= 18.5 && bmi <= 24.9) {
                category = "Normal Weight"; color = "#2ecc71"; goalStr = "Maintenance";
                targetCals = tdee; // Maintenance
                dietType = "maintain";
            } else if (bmi >= 25 && bmi <= 29.9) {
                category = "Overweight"; color = "#f1c40f"; goalStr = "Weight Loss";
                targetCals = tdee - 500; // Deficit
                dietType = "cut";
            } else {
                category = "Obese"; color = "#e74c3c"; goalStr = "Aggressive Loss";
                targetCals = tdee - 750; // Larger Deficit
                dietType = "cut";
            }

            // Macros (Protein: 30%, Carbs: 40%, Fats: 30%)
            let proteinGrams = Math.round((targetCals * 0.30) / 4);
            let carbsGrams = Math.round((targetCals * 0.40) / 4);
            let fatsGrams = Math.round((targetCals * 0.30) / 9);

            // Update UI
            document.getElementById('bmiNumber').innerText = bmi;
            document.getElementById('bmiNumber').style.color = color;
            document.getElementById('bmiStatus').innerText = category;
            document.getElementById('bmiStatus').style.color = color;
            
            document.getElementById('bmrText').innerText = Math.round(bmr) + " kcal";
            document.getElementById('tdeeText').innerText = Math.round(tdee) + " kcal";
            document.getElementById('targetCalText').innerText = Math.round(targetCals) + " kcal";
            document.getElementById('goalText').innerText = goalStr;

            document.getElementById('protText').innerText = `🍖 ${proteinGrams}g Pro`;
            document.getElementById('carbText').innerText = `🍚 ${carbsGrams}g Carb`;
            document.getElementById('fatText').innerText = `🥑 ${fatsGrams}g Fat`;

            generateDietPlan(dietType, Math.round(targetCals));

            document.getElementById('resultBox').style.display = "block";
            document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Generate Sample Diet Plan based on Goal
        function generateDietPlan(type, calories) {
            let meals = {};

            if (type === "cut") {
                meals = {
                    breakfast: "Scrambled egg whites with spinach, tomatoes, and 1 slice of whole-grain toast. Black coffee or green tea.",
                    lunch: "Large mixed green salad with grilled chicken breast, cucumber, cherry tomatoes, and a light vinaigrette.",
                    snack: "Greek yogurt (non-fat) with a handful of berries or a protein shake mixed with water.",
                    dinner: "Baked white fish or tofu, a large portion of steamed broccoli, and a small serving of quinoa."
                };
            } else if (type === "bulk") {
                meals = {
                    breakfast: "Oatmeal cooked with whole milk, topped with peanut butter, banana slices, chia seeds, and 2 whole eggs on the side.",
                    lunch: "Whole wheat wrap with grilled chicken/steak, avocado, cheese, and a side of mixed nuts.",
                    snack: "High-calorie protein shake (protein powder, milk, banana, oats, and peanut butter).",
                    dinner: "Salmon or beef steak, large portion of sweet potato or brown rice, roasted olive-oil veggies."
                };
            } else {
                meals = {
                    breakfast: "2 whole eggs scrambled, 1 slice whole-wheat toast, and a piece of fruit (apple or orange).",
                    lunch: "Grilled chicken or chickpeas with quinoa, mixed vegetables, and a drizzle of olive oil.",
                    snack: "A handful of almonds and a low-sugar greek yogurt.",
                    dinner: "Baked salmon or grilled tofu, a side of brown rice, and steamed asparagus."
                };
            }

            const dietHTML = `
                <div class="meal-item"><div class="meal-time">Breakfast (~${Math.round(calories*0.25)} kcal)</div><div class="meal-desc">${meals.breakfast}</div></div>
                <div class="meal-item"><div class="meal-time">Lunch (~${Math.round(calories*0.30)} kcal)</div><div class="meal-desc">${meals.lunch}</div></div>
                <div class="meal-item"><div class="meal-time">Snack (~${Math.round(calories*0.15)} kcal)</div><div class="meal-desc">${meals.snack}</div></div>
                <div class="meal-item"><div class="meal-time">Dinner (~${Math.round(calories*0.30)} kcal)</div><div class="meal-desc">${meals.dinner}</div></div>
            `;
            document.getElementById('dietPlanContent').innerHTML = dietHTML;
        }
    </script>
</body>
</html>
